[project]
name = "spotcast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bora", email = "ozisikbora@gmail.com" }
]
requires-python = ">=3.12"
# What the API needs at runtime. This is all that goes into the Docker image.
dependencies = [
    "fastapi[standard]>=0.162.0",
    "joblib>=1.6.0",
    "pandas>=3.1.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
spotcast = "spotcast:main"
spotcast-forecast = "spotcast.wind_model:main"
spotcast-lstm = "spotcast.lstm_model:main"
spotcast-api = "spotcast.api:run"
spotcast-index = "spotcast.rag:main"
spotcast-vision = "spotcast.vision:main"
spotcast-ocr = "spotcast.ocr:main"
spotcast-tools = "spotcast.tools:main"
spotcast-agent = "spotcast.agent:main"
spotcast-graph = "spotcast.agent_graph:main"
spotcast-mcp = "spotcast.mcp_server:main"
spotcast-eval = "spotcast.evals.run:main"
spotcast-publish = "spotcast.publish:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
# Training and experiment tracking (Stages 2-3, MLflow). pyarrow: the Parquet history cache
train = [
    "mlflow>=3.18.0",
    "pyarrow>=26.0.0",
    "torch>=2.15.0",
    "xgboost>=3.4.1",
]
# Agents and the MCP server (Stage 7)
agents = [
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.20",
    "mcp[cli]>=2.3.0",
]
# Photos and OCR (Stage 6)
vision = [
    "pillow>=13.0.0",
]

[tool.uv.sources]
# On Linux (GitHub Actions) PyPI's torch brings ~3 GB of NVIDIA CUDA libraries we never use:
# take the CPU-only build there. macOS is unaffected (it uses the Apple GPU through MPS).
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # only packages listed in [tool.uv.sources] come from here

[tool.uv]
# `uv sync` / `uv run` on this computer install everything, as before.
# The Docker image uses `--no-default-groups` and gets only the API's dependencies.
default-groups = ["dev", "train", "agents", "vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A warning today is often an error after the next library update: fail on it now
filterwarnings = [
    "error",
    # MLflow's own database code uses an option SQLAlchemy 2.1 deprecated. Not our code and
    # not fixable here: ignore exactly this warning, nothing else. Remove when MLflow fixes it.
    "ignore:The ``noload`` loader strategy is deprecated:sqlalchemy.exc.SADeprecationWarning",
]

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused names, undefined variables), I: import order,
# B: common bug patterns (bugbear), UP: newer Python syntax, SIM: simpler code
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Line length is handled by the formatter. The long lines left are prompts and messages,
# which read better unbroken.
ignore = ["E501"]
