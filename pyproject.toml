[project]
name = "spotcast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bora", email = "ozisikbora@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "joblib>=1.6.0",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.6",
    "torch>=2.15.0",
    "xgboost>=3.4.1",
]

[project.scripts]
spotcast = "spotcast:main"
spotcast-forecast = "spotcast.wind_model:main"
spotcast-lstm = "spotcast.lstm_model:main"
spotcast-api = "spotcast.api:run"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
