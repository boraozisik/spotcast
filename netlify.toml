# Netlify: builds the Next.js site in web/ as plain static files.
# The forecast data is NOT part of the build: the browser reads it from the `site-data`
# branch on GitHub, which a scheduled workflow refreshes several times a day. So the site only
# needs a new deploy when the website code changes.

[build]
  base = "web"
  command = "npm run build"
  publish = "out"
  # Skip the build (and save Netlify credits) when nothing in web/ changed, e.g. after a
  # Python-only commit. Without a build cache Netlify sets CACHED_COMMIT_REF = COMMIT_REF,
  # so comparing them finds "no change" even when there is one: always build in that case.
  ignore = '[ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- .'

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_DATA_URL = "https://raw.githubusercontent.com/boraozisik/spotcast-ai/site-data"

# Security headers. The site has no backend, but these still stop other sites from framing
# it, block content-type tricks, and only allow data from this site and the data branch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Geolocation for this site only ("places near me"): the location stays in the
    # browser, distances are computed on the page and nothing is sent anywhere
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://raw.githubusercontent.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
