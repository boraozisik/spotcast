# Every location SpotCast knows. This file is the single source of truth: the code reads
# it, and `uv run spotcast-sync-locations` copies it into the database.
#
# Fields:
#   name       unique display name
#   region     province
#   latitude   decimal degrees (-90..90); a point on the water, not the town centre
#   longitude  decimal degrees (-180..180)
#   guide      optional: local guide in knowledge/ (e.g. "spots/alacati.md"). A location
#              with a guide is a "spot": curated, with a training history. Without one it
#              is a "place": assessed from the forecast alone.
#
# Adding a location is one [[location]] block. Check first that the point gets wave data
# (Open-Meteo marine returns nothing for points on land).
#
# Keep the three spots first and in this order: the trained wind models (Stage 3) see the
# spot as a category in this order.

# --- Guided spots ---

[[location]]
name = "Kuşadası Pamucak"
region = "Aydın"
latitude = 37.94
longitude = 27.27
guide = "spots/kusadasi_pamucak.md"

[[location]]
name = "Alaçatı"
region = "İzmir"
latitude = 38.255
longitude = 26.375
guide = "spots/alacati.md"

[[location]]
name = "Akyaka"
