# Every location SpotCast knows. This file is the single source of truth: the code reads
# it, and `uv run spotcast-sync-locations` copies it into the database.
#
# Fields:
#   name       unique display name
#   region     province
#   latitude   decimal degrees (-90..90); a point on the water, not the town centre
#   longitude  decimal degrees (-180..180)
#   guide      optional: local guide in knowledge/ (e.g. "spots/alacati.md"). A location
#              with a guide is a "spot": curated, with a training history. Without one it
#              is a "place": assessed from the forecast alone.
#   shore_facing  compass direction from the beach to the open water (south-facing: 180).
#              Decides when the wind is offshore (from the land out to sea). Without it
#              the offshore rule can't be checked, and the tools say so.
#   sheltered  optional, default false: a closed bay. Offshore wind there pushes you across
#              the bay to another shore, not out to the open sea, so offshore hours are
#              not marked unsafe for that reason alone; every answer explains it in a
#              warning. Max wind, max waves and darkness still apply. Set it only where
#              someone who knows the place confirms it.
#   sports     optional: the sports done here. Without it no sport is excluded (we don't
#              know); recommendations skip spots whose list doesn't have the sport.
#
# Adding a location is one block. The point must be ON THE WATER, a few hundred metres off
# the beach. The wave forecast is no check: its grid is kilometres wide, so it also returns
# data for points on land. Run scripts/shore_facing.py: it says land or sea, suggests a
# point at sea and computes shore_facing.
#
# Coordinates and shore_facing were checked against the OpenStreetMap coastline in Stage 11
# (15 of 29 points were on land). Coastline data © OpenStreetMap contributors, ODbL.
#
# Keep the three spots first and in this order: the trained wind models (Stage 3) see the
# spot as a category in this order.

# --- Guided spots ---

[[location]]
name = "Kuşadası Pamucak"
region = "Aydın"
latitude = 37.9406
longitude = 27.2703
shore_facing = 255
sports = ["windsurf", "kitesurf", "sup", "kayak"]
guide = "spots/kusadasi_pamucak.md"

[[location]]
name = "Alaçatı"
region = "İzmir"
latitude = 38.243
longitude = 26.38
shore_facing = 120
# The windsurf beach faces east-southeast, so westerly and north-westerly wind blows from
# the land (a third of the windy hours). The bay is closed: a drifting rider reaches its
# eastern shore. Confirmed by Bora (Stage 11).
sheltered = true
sports = ["windsurf", "kitesurf", "sup"]
guide = "spots/alacati.md"

[[location]]
name = "Akyaka"
region = "Muğla"
latitude = 37.0471
longitude = 28.3071
shore_facing = 175
sports = ["windsurf", "kitesurf", "sup", "kayak"]
guide = "spots/akyaka.md"

