# Continuous integration: every pull request and every push to main is checked on a
# fresh GitHub machine. Three independent jobs run in parallel:
#
#   lint    Ruff rules and formatting
#   test    the whole pytest suite (fakes only: no database, Ollama or internet needed)
#   docker  the API image still builds
#
# The real LLM evaluations (spotcast-eval) are NOT here: they need Ollama and a GPU and take
# minutes. They run locally, on purpose.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: these jobs only need to read the code
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # Only the dev tools (ruff, pytest), not the project: linting needs no torch
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true  # downloaded packages are reused by the next run
      # --locked: fail if uv.lock doesn't match pyproject.toml (someone forgot to commit it)
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false  # only check that it builds; publishing comes with deployment
          cache-from: type=gha
          cache-to: type=gha,mode=max
